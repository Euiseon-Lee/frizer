name: CI

# master로 push(머지 포함)되면 전체 테스트를 돌린다.
# Render 자동 배포는 이 체크가 통과한 커밋만 배포한다(autoDeployTrigger: checksPass).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java 테스트와 JAR 빌드 (Testcontainers PostgreSQL)
        run: ./gradlew test bootJar
      - name: JS 테스트 (node --test)
        run: node --test src/test/js/*.test.cjs
