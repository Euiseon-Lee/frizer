name: Render keep-alive

on:
  schedule:
    # Every five minutes, offset from the busiest start of the hour (UTC).
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 1 --retry-delay 5 --retry-max-time 185 \
            https://frizer-y4tg.onrender.com/health)"
          if [[ "$response" != "ok" ]]; then
            echo 'Health endpoint did not return the expected response.' >&2
            exit 1
          fi
          echo 'Render health check passed.'
