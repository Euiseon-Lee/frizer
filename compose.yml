name: frizer

services:
  app:
    profiles: ["app"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FRIZER_DB_URL: jdbc:postgresql://postgres:5432/frizer
      FRIZER_DB_USERNAME: frizer
      FRIZER_DB_PASSWORD: ${FRIZER_DB_PASSWORD:?Set FRIZER_DB_PASSWORD in .env or your environment}
      FRIZER_LOGIN_USERNAME: ${FRIZER_LOGIN_USERNAME:-frizer}
      FRIZER_LOGIN_PASSWORD: ${FRIZER_LOGIN_PASSWORD:-}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${FRIZER_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: frizer
      POSTGRES_USER: frizer
      POSTGRES_PASSWORD: ${FRIZER_DB_PASSWORD:?Set FRIZER_DB_PASSWORD in .env or your environment}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    ports:
      - "127.0.0.1:${FRIZER_DB_PORT:-5432}:5432"
    volumes:
      - frizer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frizer -d frizer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  frizer_postgres_data:
