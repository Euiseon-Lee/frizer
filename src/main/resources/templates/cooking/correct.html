<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FR!ZER | 요리 수량 정정</title><link rel="stylesheet" th:href="@{/css/app.css(v='cooking-31')}"><script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header><main class="page form-page"><section class="heading character-heading tab-heading"><div><p class="eyebrow" th:text="${context.record().foodName()}"></p><h1 th:text="${context.amountLabel()+' 정정'}"></h1></div><img class="choco" width="85" height="114" alt="쪼코" data-choco-region="edit-header" data-choco-role="edit-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section><div class="tab-sheet">
<p class="error-summary" role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p><section class="form-section"><h2 th:text="${context.item().foodName()}"></h2><dl class="history-fields"><div><dt th:text="${context.amountLabel()}"></dt><dd th:text="${context.effective()}"></dd></div><div><dt>현재 잔량</dt><dd th:text="${context.item().displayQuantity()}"></dd></div></dl></section>
<form method="post" th:action="@{/cooking/{id}/correct/{foodId}/preview(id=${correction.cookingId()},foodId=${correction.foodId()})}"><input type="hidden" name="requestId" th:value="${correction.requestId()}"><input type="hidden" name="cookingVersion" th:value="${correction.cookingVersion()}"><input type="hidden" name="itemVersion" th:value="${correction.itemVersion()}">
<section class="form-section"><div class="field"><label for="amount" th:text="${'실제 '+context.amountLabel()+' ('+context.unit()+')'}"></label><input id="amount" name="amount" type="number" th:min="${context.output() ? '0.01' : '0'}" max="999999999.99" step="0.01" inputmode="decimal" required th:value="${correction.amount()}"></div>
<p class="help" th:if="${context.needsRemaining()}">이후 수량을 수정하거나 나눈 이력이 있어. 재고를 확인하고 현재 잔량도 입력해줘. 이미 고친 수량을 두 번 더하지 않을게.</p>
<div class="field"><label for="confirmedRemaining">확인한 현재 잔량 <span th:text="${'('+context.unit()+')'}"></span><span class="required" th:if="${context.needsRemaining()}">필수</span></label><input id="confirmedRemaining" name="confirmedRemaining" type="number" min="0" max="999999999.99" step="0.01" inputmode="decimal" th:required="${context.needsRemaining()}" th:value="${correction.confirmedRemaining()}"><p class="help" th:unless="${context.needsRemaining()}">비워두면 정정한 양만큼 현재 잔량을 조정해. 이미 잔량을 고쳤다면 실제 확인한 양을 입력해줘.</p></div>
<p class="help" th:text="${context.output() ? '재료 사용량은 그대로 유지돼. 먹은 양도 기존 소비 기록을 유지해.' : '결과 음식의 수량은 그대로 유지돼. 사용하지 않은 재료는 실제 사용량을 0으로 정정할 수 있어.'}"></p></section>
<div class="form-actions"><a class="cancel-link" th:href="@{/cooking/{id}(id=${correction.cookingId()})}">돌아가기</a><button class="button action-update" type="submit">정정 내용 확인</button></div></form>
</div></main><nav th:replace="~{fragments/shell :: nav('history')}"></nav></body></html>
