<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FR!ZER | 정정 확인</title><link rel="stylesheet" th:href="@{/css/app.css(v='cooking-31')}"><script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header><main class="page form-page"><section class="heading character-heading tab-heading"><div><p class="eyebrow">요리 수량 정정</p><h1>이렇게 고칠까?</h1></div><img class="choco" width="85" height="114" alt="쪼코" data-choco-region="edit-header" data-choco-role="edit-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section><div class="tab-sheet">
<section class="form-section"><h2 th:text="${preview.context().item().foodName()}"></h2><dl class="history-fields"><div><dt th:text="${preview.context().amountLabel()}"></dt><dd th:text="${preview.context().effective()+' → '+preview.amount()}"></dd></div><div><dt>현재 잔량</dt><dd th:text="${preview.context().item().displayQuantity()+' → '+preview.remainingText()}"></dd></div></dl></section>
<form method="post" th:action="@{/cooking/{id}/correct(id=${preview.command().cookingId()})}"><input type="hidden" name="requestId" th:value="${preview.command().requestId()}"><div class="form-actions"><a class="cancel-link" th:href="@{/cooking/{id}/correct/{foodId}(id=${preview.command().cookingId()},foodId=${preview.command().foodId()})}">다시 입력</a><button class="button action-update" type="submit">정정 저장</button></div></form>
</div></main><nav th:replace="~{fragments/shell :: nav('history')}"></nav></body></html>
