<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FR!ZER | 요리 기록</title><link rel="stylesheet" th:href="@{/css/app.css(v='cooking-detail-44')}"><script>document.documentElement.classList.add('js-title-fit')</script><script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script><script th:src="@{/js/food-title.js}" defer></script><script th:src="@{/js/notices.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header><main class="page form-page">
<section class="heading character-heading tab-heading"><div><p class="eyebrow">요리 기록</p><h1 class="detail-title" th:text="${cooking.foodName()}"></h1></div><img class="choco" width="78" height="95" alt="쪼코" data-choco-region="detail-header" data-choco-role="detail-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section><div class="tab-sheet">
<div class="notice purchase-notice" role="status" th:if="${successMessage != null}"><div class="purchase-notice-content"><span th:text="${successMessage}"></span></div></div><p class="error-summary" role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
<section class="form-section purchase-detail-card"><div class="cooking-record-heading"><span class="action-badge history-badge" data-event="COOK_IN">요리</span></div>
<dl class="detail-grid quantity-info-grid"><div><dt>수량</dt><dd th:text="${cooking.quantity()}"></dd></div><div><dt>조리일</dt><dd th:text="${cooking.cookedAt()}"></dd></div></dl>
<p class="help" th:if="${cooking.versionNo() > 0}">정정한 수량이 반영되어 있어. 정정 전 기록은 수량 변경 이력에 남아 있어.</p>
<p class="help" th:unless="${cooking.resultExists()}">결과 음식 항목은 삭제되었어. 요리 당시 기록은 보관하고 있어.</p>
<div class="stock-card-footer purchase-detail-footer"><span>등록 <time th:datetime="${cooking.createdAt()}" th:text="${#temporals.format(cooking.createdAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy-MM-dd HH:mm')}"></time></span></div></section>
<div class="form-actions purchase-primary-actions" th:if="${cooking.resultExists()}"><a class="button button-secondary" th:href="@{/inventory/{id}(id=${cooking.resultFoodId()},cooking=${cooking.cookingId()},quantityHistory=true)}+'#quantity-history'">수량 이력 보기</a><a class="button action-update" th:href="@{/cooking/{id}/correct/{foodId}(id=${cooking.cookingId()},foodId=${cooking.resultFoodId()})}">수량 정정</a></div>
<div class="inventory-bar"><h2 id="cookingIngredientsTitle">사용한 재료 <span class="count" th:text="${ingredients.size()}"></span></h2></div>
<p class="small muted stock-list-hint">재료명을 누르면 수량 변경 이력을 볼 수 있어.</p>
<section class="food-grid" aria-labelledby="cookingIngredientsTitle">
<article class="food-card master-item-card cooking-ingredient-card" th:each="ingredient : ${ingredients}">
<h3 class="food-title"><a th:if="${ingredient.itemExists()}" th:href="@{/inventory/{id}(id=${ingredient.foodId()},cooking=${cooking.cookingId()},quantityHistory=true)}+'#quantity-history'" th:aria-label="${ingredient.foodName()+' 수량 변경 이력'}" th:text="${ingredient.foodName()}"></a><span th:unless="${ingredient.itemExists()}" th:text="${ingredient.foodName()}"></span></h3>
<dl class="stock-dates"><div><dt>사용량</dt><dd th:text="${ingredient.used()}"></dd></div><div><dt>최초 기록</dt><dd th:text="${ingredient.before()+' → '+ingredient.after()}"></dd></div></dl>
<div class="stock-card-footer cooking-ingredient-actions"><a class="button action-update" th:if="${ingredient.itemExists()}" th:href="@{/cooking/{id}/correct/{foodId}(id=${cooking.cookingId()},foodId=${ingredient.foodId()})}" th:aria-label="${ingredient.foodName()+' 사용량 정정'}">사용량 정정</a><span th:unless="${ingredient.itemExists()}">삭제된 보관 항목이야.</span></div>
</article></section><div class="form-actions"><a class="cancel-link purchase-back-link" th:href="@{/history}">히스토리로</a></div>
</div></main><nav th:replace="~{fragments/shell :: nav('history')}"></nav></body></html>
