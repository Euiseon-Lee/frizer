<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="quantity(unitPlaceholder, showHelp)" class="field">
    <div class="quantity-input-row">
        <div><label for="quantityAmount">수량 <span class="required">필수</span></label><input type="text" inputmode="decimal" th:field="*{quantityAmount}" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('quantityAmount')},aria-describedby=${#fields.hasErrors('quantityAmount') ? (showHelp ? 'quantityHelp quantityAmount-error' : 'quantityAmount-error') : (showHelp ? 'quantityHelp' : null)}" placeholder="예: 2, 0.5" pattern="[0-9]+([.][0-9]{1,2})?" required><p class="field-error" id="quantityAmount-error" th:errors="*{quantityAmount}"></p></div>
        <div><label for="quantityUnit">단위 <span class="required">필수</span></label><input th:field="*{quantityUnit}" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('quantityUnit')},aria-describedby=${#fields.hasErrors('quantityUnit') ? 'quantityUnit-error' : null}" th:placeholder="${unitPlaceholder}" maxlength="4" required><p class="field-error" id="quantityUnit-error" th:errors="*{quantityUnit}"></p></div>
    </div>
    <p class="help" th:if="${legacyQuantity != null}" th:text="${'기존 수량: ' + legacyQuantity + '. 숫자와 단위로 나눠서 확인해줘.'}"></p>
    <p class="help" id="quantityHelp" th:if="${showHelp}"><th:block th:if="${editId == null}">반 봉지가 남았다면 수량은 0.5, 단위는 봉지로 적으면 돼.</th:block><span class="quantity-purchase-help" th:if="${editId != null}">잔량이 수정되니, 새로 구매했다면 ‘추가 등록’을 이용해줘.</span></p>
</div>
<div th:fragment="capacity(placeholder, help)" class="field"><label for="capacityText">용량 <span class="optional">선택</span></label><input th:field="*{capacityText}" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('capacityText')},aria-describedby=${#fields.hasErrors('capacityText') ? 'capacityText-error' : null}" th:placeholder="${placeholder}" maxlength="50"><p class="field-error" id="capacityText-error" th:errors="*{capacityText}"></p><p class="help" th:text="${help}" th:if="${help != null}"></p></div>
<div th:fragment="memo(placeholder)" class="field"><label for="memo">메모 <span class="optional">선택</span></label><textarea th:field="*{memo}" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('memo')},aria-describedby=${#fields.hasErrors('memo') ? 'memo-error' : null}" rows="2" maxlength="500" th:placeholder="${placeholder}"></textarea><p class="field-error" id="memo-error" th:errors="*{memo}"></p></div>
</body></html>
