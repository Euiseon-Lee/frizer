<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="accessHeading(eyebrow, title, description, errorImage)" class="heading character-heading tab-heading" th:classappend="${!errorImage and title == '음식 재고 관리'} ? 'login-heading' : null">
    <div><p class="eyebrow" th:text="${eyebrow}"></p><h1 th:text="${title}"></h1><p class="muted" th:if="${description != null}" th:text="${description}"></p></div>
    <img th:unless="${errorImage}" class="choco choco-loading" th:src="@{/assets/choco/web/v1/happy-run-front.webp}" data-choco-static decoding="async" width="120" height="150" alt="쪼코">
    <img th:if="${errorImage}" class="choco" width="120" height="150" alt="쪼코" data-choco-region="error-image" data-choco-role="error" th:attr="data-choco-base=@{/assets/choco/}" hidden>
</section>
<th:block th:fragment="historyChange(value)"><span th:each="part : ${value.split('(?<=→)|(?=→)', -1)}" th:class="${part == '→' ? 'history-change-arrow' : null}" th:text="${part}"></span></th:block>
<span th:fragment="elapsedDays(date, today)" class="elapsed-days" th:if="${date != null and !date.isAfter(today)}" th:text="${'(+' + T(java.time.temporal.ChronoUnit).DAYS.between(date, today) + '일)'}"></span>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/}" aria-label="FR!ZER 홈">fr<span>!</span>zer<span class="brand-dot">●</span></a>
    <a th:if="${showProfile != false}" class="profile-link" th:href="${accessEnabled == true} ? @{/account} : @{/}" th:aria-label="${accessEnabled == true ? '내 프로필과 로그아웃' : '쪼코와 우리 집 냉장고'}"><span>내 프로필</span><img width="32" height="32" alt="쪼코" data-choco-region="profile" data-choco-role="profile" th:attr="data-choco-base=@{/assets/choco/}" hidden></a>
</header>
<nav th:fragment="nav(active)" class="bottom-nav" aria-label="주 메뉴">
    <a th:href="@{/}" th:attr="aria-current=${active == 'home' ? 'page' : null}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H4V10m5 10v-7h6v7"/></svg><span>홈</span></a>
    <a th:href="@{/inventory}" th:attr="aria-current=${active == 'inventory' ? 'page' : null}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 9h14M8 5v1m0 7v3"/></svg><span>뭐 있지?</span></a>
    <a class="nav-add" th:href="@{/inventory/new}" th:attr="aria-current=${active == 'new' ? 'page' : null}" aria-label="이건 뭐야?"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>이건 뭐야?</span></a>
    <a th:href="@{/history}" th:attr="aria-current=${active == 'history' ? 'page' : null}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5zM9 2v4m6-4v4M8 10h8m-8 4h8m-8 4h5"/></svg><span>히스토리</span></a>
</nav>
<div th:fragment="historyRows(entries)" class="history-rows">
    <article class="history-row" th:each="entry : ${entries}">
        <span class="action-badge history-badge" th:attr="data-event=${entry.actionType() != null ? entry.actionType() : 'MERGE'}" th:text="${entry.actionLabel()}"></span>
        <div><a th:if="${entry.foodId() != null}" th:href="@{/inventory/{id}(id=${entry.foodId()})}" th:text="${entry.displayFoodName()}"></a>
            <a th:if="${entry.foodId() == null}" th:href="${entry.currentMasterId() != null} ? @{/foods/{id}(id=${entry.currentMasterId()})} : @{/inventory}" th:text="${entry.displayFoodName()}"></a>
            <p class="small muted history-current-location" th:if="${entry.currentLocationNote() != null}" th:text="${entry.isMerge() ? (entry.foodId() != null ? '변경한 음식의 개별 구매 항목으로 이동이 될 거야.' : (entry.currentMasterId() != null ? '변경한 음식의 개별 구매 목록으로 이동할 거야.' : entry.currentLocationNote())) : entry.currentLocationNote()}"></p>
            <dl class="history-fields"><div th:each="field : ${entry.detailFields()}"><dt th:text="${field.label()}"></dt><dd><th:block th:replace="~{fragments/shell :: historyChange(${field.value()})}"></th:block></dd></div></dl>
            <time class="small muted" th:text="${#temporals.format(entry.createdAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy-MM-dd HH:mm')}"></time>
        </div>
    </article>
</div>
<div th:fragment="recentHistoryRows(entries)" class="recent-history-rows">
    <a class="recent-history-row" th:each="entry : ${entries}" th:href="@{/history}">
        <span class="action-badge history-badge" th:attr="data-event=${entry.actionType() != null ? entry.actionType() : 'MERGE'}" th:text="${entry.actionLabel()}"></span>
        <span class="recent-food-name" th:text="${entry.displayFoodName()}" th:title="${entry.displayFoodName()}"></span>
        <span class="recent-change" th:text="${entry.homeSummary()}"></span>
    </a>
</div>
</body></html>
