<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>일괄 등록 · FR!ZER</title><link rel="stylesheet" th:href="@{/css/app.css}"><script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script><script th:src="@{/js/registration-mode-navigation.js}" defer></script><script th:src="@{/js/bulk-registration.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header>
<main class="page form-page">
<section class="heading character-heading tab-heading"><div><p class="eyebrow">킁킁, 맛있는 냄새!</p><h1>이건 뭐야?</h1><p class="muted">등록하면 쪼코가 기억할게.</p></div><img class="choco" width="100" height="134" alt="쪼코" data-choco-region="add-header" data-choco-role="add-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section>
<div class="tab-sheet">
<fieldset class="registration-modes" id="bulkRegistrationModes"><legend class="sr-only">등록 방식</legend>
<label><input type="radio" name="registrationMode" value="new" th:attr="data-mode-url=@{/inventory/new}"><span>신규 등록</span></label>
<label><input type="radio" name="registrationMode" value="existing" th:attr="data-mode-url=@{/inventory/new(registrationMode='existing')}"><span>추가 등록</span></label>
<label><input type="radio" name="registrationMode" value="bulk" checked><span>일괄 등록</span></label>
</fieldset>
<section th:replace="~{fragments/bulk-registration :: content}"></section>
</div></main><nav th:replace="~{fragments/shell :: nav('new')}"></nav>
</body></html>
