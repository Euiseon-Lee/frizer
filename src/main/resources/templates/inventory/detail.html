<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${food.foodName() + ' · FR!ZER'}">음식 상세 · FR!ZER</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/choco.js}" defer></script></head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="page form-page">
    <p class="notice" role="status" th:if="${successMessage != null}" th:text="${successMessage}"></p>
    <a class="back-link" th:href="@{/inventory}">← 내 냉장고</a>
    <section class="heading character-heading"><div><p class="eyebrow">기록해 둔 음식</p><h1 class="detail-title" th:text="${food.foodName()}"></h1><p class="muted">어떻게 보관했는지 살펴볼까?</p></div><img class="choco" data-choco="history" th:src="@{/assets/choco/look-aside.png}" width="92" height="112" alt="쪼코"></section>
    <p class="error-summary" th:if="${food.expiredAt() != null and food.expiredAt().isBefore(today)}">소비기한 경과 — 확인 필요</p>
    <section class="form-section">
        <div class="section-label"><span>01</span><h2>음식 정보</h2></div>
        <dl class="detail-grid">
            <div><dt>수량</dt><dd th:text="${food.quantityText() ?: '미입력'}"></dd></div>
            <div><dt>용량</dt><dd th:text="${food.capacityText() ?: '미입력'}"></dd></div>
            <div><dt>출처</dt><dd th:text="${sourceLabels[food.sourceType()]}"></dd></div>
            <div th:if="${food.sourceMemo() != null}"><dt>출처 메모</dt><dd th:text="${food.sourceMemo()}"></dd></div>
            <div><dt>분류</dt><dd th:text="${food.category() ?: '미입력'}"></dd></div>
            <div><dt>보관 위치</dt><dd th:text="${storageLabels[food.storageType()]}"></dd></div>
            <div><dt>상태</dt><dd th:text="${food.status().name() == 'ACTIVE' ? '보관 중' : (food.status().name() == 'CONSUMED' ? '소비 완료' : '폐기 완료')}"></dd></div>
        </dl>
    </section>
    <section class="form-section">
        <div class="section-label"><span>02</span><h2>날짜와 냉동 정보</h2></div>
        <dl class="detail-grid">
            <div><dt>유통기한</dt><dd th:text="${food.sellByAt() ?: '미입력'}"></dd><dd class="small expired" th:if="${food.sellByAt() != null and food.sellByAt().isBefore(today)}">유통기한 경과</dd></div>
            <div><dt>소비기한</dt><dd th:text="${food.expiredAt() ?: '미입력'}"></dd></div>
            <div><dt>구매일</dt><dd th:text="${food.purchasedAt() ?: '미입력'}"></dd></div>
            <div><dt>개봉일</dt><dd th:text="${food.openedAt() ?: '미입력'}"></dd></div>
            <div th:if="${food.storageType().name() == 'FREEZER'}"><dt>냉동 유형</dt><dd th:text="${food.freezeType().name() == 'COMMERCIAL_FROZEN' ? '시판 냉동식품' : '직접 냉동'}"></dd></div>
            <div th:if="${food.storageType().name() == 'FREEZER'}"><dt>냉동 보관 시작일</dt><dd th:text="${food.frozenAt() ?: '냉동일 미상'}"></dd></div>
        </dl>
    </section>
    <section class="form-section">
        <div class="section-label"><span>03</span><h2>메모</h2></div>
        <p class="detail-memo" th:text="${food.memo() ?: '남긴 메모가 없어.'}"></p>
    </section>
    <p class="small muted">등록 <time th:text="${#temporals.format(food.createdAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy.MM.dd HH:mm')}"></time><span th:if="${food.updatedAt().isAfter(food.createdAt())}"> · 수정 <time th:text="${#temporals.format(food.updatedAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy.MM.dd HH:mm')}"></time></span> (한국 시간)</p>
    <div class="form-actions"><a class="button" th:if="${food.status().name() == 'ACTIVE'}" th:href="@{/inventory/{id}/edit(id=${food.foodId()})}">수정</a><a class="button" th:href="@{/inventory}">내 냉장고로 돌아가기</a></div>
</main>
<nav th:replace="~{fragments/shell :: nav('inventory')}"></nav></body>
</html>
