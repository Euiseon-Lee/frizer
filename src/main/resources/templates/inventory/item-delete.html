<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FR!ZER | 오등록 삭제</title><link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header><main class="page form-page">
<section class="heading character-heading tab-heading"><div><p class="eyebrow" th:text="${(ended ? '종료 항목 ' : '보관 중인 항목 ') + items.size() + '건 선택'}"></p><h1>오등록한 항목 지우기</h1></div>
<img class="choco" width="78" height="95" alt="쪼코" data-choco-region="detail-header" data-choco-role="detail-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section>
<div class="tab-sheet">
<p class="error-summary" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<section class="merge-source"><p class="small muted">삭제 대상 항목</p><p class="merge-source-name" th:text="${master.foodName()}"></p>
<ul class="small muted move-item-list"><li th:each="item : ${items}"><span th:text="${item.storageType().name() == 'ROOM' ? '실온' : (item.storageType().name() == 'FRIDGE' ? '냉장실' : '냉동실')}"></span> · <span th:text="${item.displayQuantity() ?: '수량 미입력'}"></span><span th:if="${item.status().name() == 'DEPLETED'}"> · 보관 종료</span></li></ul>
<p class="merge-caution move-keep-note" th:if="${whole}">모든 항목을 지우는 거라서 음식까지 전부 삭제할 수 있어.</p></section>
<section class="merge-preview"><h2>이렇게 삭제할 거야</h2>
<div class="merge-preview-card">
<dl class="merge-facts"><div><dt>개별 구매 총 건수</dt><dd th:text="${items.size() + '건'}"></dd></div><div><dt>음식 이력 총 건수</dt><dd th:text="${historyCount + '건'}"></dd></div></dl>
</div>
<p class="merge-caution move-keep-note">삭제한 항목은 기록 및 통계에서 사라져.</p>
<p class="merge-caution">이 작업은 취소할 수 없어.</p>
<form method="post" th:action="@{/foods/{id}/delete(id=${master.masterId()})}">
<label class="check-label" th:if="${whole}"><input type="checkbox" name="deleteMaster" value="true"><span>음식 ‘<span th:text="${master.foodName()}"></span>’ 그룹도 함께 삭제할게</span></label>
<input type="hidden" name="sourceId" th:value="${master.masterId()}"><input type="hidden" name="sourceVersion" th:value="${master.versionNo()}">
<input type="hidden" name="ended" th:value="${ended}"><input type="hidden" name="requestId" th:value="${requestId}">
<th:block th:each="item : ${items}"><input type="hidden" name="itemIds" th:value="${item.foodId()}"><input type="hidden" name="itemVersions" th:value="${versions[item.foodId()]}"></th:block>
<button class="button merge-submit action-delete" type="submit">확인했어, 지울게</button></form></section>
<div class="form-actions"><a class="cancel-link purchase-back-link" th:href="@{/foods/{id}(id=${master.masterId()},ended=${ended ? true : null})}">돌아가기</a></div>
</div></main><nav th:replace="~{fragments/shell :: nav('inventory')}"></nav></body></html>
