<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FR!ZER</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script></head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="page">
    <section class="heading character-heading tab-heading"><div><p class="eyebrow">쪼코랑 같이 찾아보자!</p><h1>뭐가 있는지 볼까?</h1><p class="muted">궁금한 음식은 하나씩 눌러 봐.</p></div><img class="choco" width="102" height="120" alt="쪼코" data-choco-region="list-header" data-choco-role="list-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section>
    <div class="tab-sheet">
    <div class="notice" role="status" th:if="${successMessage}"><img class="choco" width="48" height="54" alt="" data-choco-region="success-create" data-choco-role="success-create" th:attr="data-choco-base=@{/assets/choco/}" hidden><p th:text="${successMessage}"></p></div><nav class="filter-tabs" aria-label="보관 위치 필터"><a th:href="@{/inventory}" th:attr="aria-current=${selectedStorage == null ? 'page' : null}">전체</a><a th:each="entry : ${storageLabels}" th:href="@{/inventory(storage=${entry.key})}" th:attr="aria-current=${selectedStorage == entry.key ? 'page' : null}" th:text="${entry.value}"></a></nav>
    <div class="inventory-bar"><h2>전체 음식 <span class="count" th:text="${groups.size()}">0</span></h2><span class="muted small">최근 등록 순</span></div>
    <section class="empty-state" th:if="${foods.isEmpty()}">
        <img class="choco" width="120" height="130" alt="" data-choco-region="list-empty" data-choco-role="empty" th:attr="data-choco-base=@{/assets/choco/}" hidden data-choco="empty"><h2 th:text="${totalCount == 0 ? '아직 등록된 음식이 없어' : '여기에는 음식이 없어'}"></h2><a class="button" th:href="@{/inventory/new}"><span th:text="${totalCount == 0 ? '첫 음식 등록하기' : '음식 등록하기'}">첫 음식 등록하기</span></a>
    </section>
    <section class="food-grid" th:unless="${foods.isEmpty()}" aria-label="전체 음식 목록">
        <a class="food-card food-group-card" th:each="group : ${groups}" th:href="@{/foods/{id}(id=${group.master().masterId()})}" th:aria-label="${group.master().foodName() + ' 상세 보기'}"><h3 class="food-title" th:text="${group.master().foodName()}"></h3><p class="small muted purchase-count" th:text="${'개별 구매 ' + group.items().size() + '건'}"></p><div class="group-stock-grid"><div class="group-stock" th:each="food : ${group.items()}">
            <div class="card-top">
                <span class="stock-location-quantity">
                    <span class="storage-tag" th:classappend="${food.storageType().name().toLowerCase()}" th:text="${storageLabels[food.storageType()]}"></span>
                    <span class="quantity"><span th:if="${food.quantityAmount() != null and food.quantityUnit() != null}"><strong th:text="${food.quantityAmount().stripTrailingZeros().toPlainString()}"></strong> <span th:text="${food.quantityUnit().strip()}"></span></span><span th:unless="${food.quantityAmount() != null and food.quantityUnit() != null}" th:text="${food.quantityText() ?: '수량 미입력'}"></span></span>
                    <span class="expiry-icon" th:if="${food.needsAttention(today)}" role="img" aria-label="날짜 경고 · 확인 필요" title="날짜 경고 · 확인 필요">!</span>
                </span>
            </div>
        </div></div></a>
    </section>
    <footer class="page-footer">쪼코가 항상 지키고 있다구</footer>
    </div>
</main>
<nav th:replace="~{fragments/shell :: nav('inventory')}"></nav></body></html>
