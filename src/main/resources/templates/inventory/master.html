<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개별 구매 목록 · FR!ZER</title><link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/choco-selector.js}" defer></script><script th:src="@{/js/choco.js}" defer></script><script th:src="@{/js/food-title.js}" defer></script></head>
<body><header th:replace="~{fragments/shell :: header}"></header>
<main class="page form-page">
<section class="heading character-heading tab-heading"><div><p class="eyebrow">개별 구매 목록</p>
<h1 class="detail-title" th:text="${master.foodName()}"></h1><p class="muted" th:text="${master.category()}"></p></div>
<img class="choco" width="92" height="112" alt="쪼코" data-choco-region="detail-header" data-choco-role="detail-header" th:attr="data-choco-base=@{/assets/choco/}" hidden></section>
<div class="tab-sheet">
<p class="notice" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
<div class="stock-list-toolbar">
<p class="small muted stock-list-hint">정보를 확인하고 수정할 수 있어.</p>
<form class="warning-filter master-warning-filter" method="get" th:action="@{/foods/{id}(id=${master.masterId()})}"><input type="hidden" name="storage" th:if="${selectedStorage != null}" th:value="${selectedStorage}"><label><input type="checkbox" name="warning" value="true" th:checked="${warningOnly}" onchange="this.form.requestSubmit()">확인이 필요한 음식만</label><noscript><button type="submit">적용</button></noscript></form>
</div>
<p th:if="${items.isEmpty()}" th:text="${warningOnly or selectedStorage != null ? '선택한 조건에 맞는 구매 항목이 없어.' : '등록된 개별 구매 항목이 없어.'}"></p>
<div class="food-grid" aria-label="개별 구매 목록">
<a class="food-card master-item-card" th:each="food : ${items}" th:href="@{/inventory/{id}(id=${food.foodId()},storage=${selectedStorage},warning=${warningOnly ? true : null})}">
<div class="stock-card-top"><span class="storage-tag" th:classappend="${food.storageType().name().toLowerCase()}" th:text="${food.storageType().name() == 'FRIDGE' ? '냉장실' : (food.storageType().name() == 'FREEZER' ? '냉동실' : '실온')}"></span>
<h3 class="stock-quantity" th:if="${food.quantityAmount() != null}"><span th:text="${food.quantityAmount().stripTrailingZeros().toPlainString()}"></span><span class="stock-unit" th:text="${food.quantityUnit().strip()}"></span></h3>
<h3 class="stock-quantity" th:unless="${food.quantityAmount() != null}" th:text="${food.quantityText() ?: '수량 미입력'}"></h3>
</div>
<dl class="stock-dates">
<div th:classappend="${food.sellByOverdue(today)} ? 'detail-warning' : ''"><dt>유통기한</dt><dd th:classappend="${food.sellByAt() == null ? 'date-unknown' : ''}"><span th:text="${food.sellByAt() == null ? '미입력' : #temporals.format(food.sellByAt(), 'yyyy.MM.dd')}"></span><span th:replace="~{fragments/shell :: elapsedDays(${food.sellByAt()}, ${today})}"></span></dd></div>
<div class="stock-expiry" th:classappend="${food.useByOverdue(today)} ? 'detail-warning' : ''"><dt>소비기한</dt><dd th:classappend="${food.expiredAt() == null ? 'date-unknown' : ''}"><span th:text="${food.expiredAt() == null ? '미입력' : #temporals.format(food.expiredAt(), 'yyyy.MM.dd')}"></span><span th:replace="~{fragments/shell :: elapsedDays(${food.expiredAt()}, ${today})}"></span></dd></div>
<div><dt>구매일</dt><dd th:classappend="${food.purchasedAt() == null ? 'date-unknown' : ''}"><span th:text="${food.purchasedAt() == null ? '미입력' : #temporals.format(food.purchasedAt(), 'yyyy.MM.dd')}"></span><span th:replace="~{fragments/shell :: elapsedDays(${food.purchasedAt()}, ${today})}"></span></dd></div>
<div th:classappend="${food.openedOverdue(today)} ? 'detail-warning' : ''"><dt>개봉일</dt><dd th:classappend="${food.openedAt() == null ? 'date-unknown' : ''}"><span th:text="${food.openedAt() == null ? '미입력' : #temporals.format(food.openedAt(), 'yyyy.MM.dd')}"></span><span th:replace="~{fragments/shell :: elapsedDays(${food.openedAt()}, ${today})}"></span></dd></div>
</dl>
<div class="stock-card-footer"><span th:text="${'등록 ' + #temporals.format(food.createdAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy.MM.dd HH:mm')}"></span><span th:if="${food.updatedAt().isAfter(food.createdAt())}" th:text="${'수정 ' + #temporals.format(food.updatedAt().atZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')), 'yyyy.MM.dd HH:mm')}"></span></div>
</a></div>
<div class="form-actions purchase-primary-actions">
<a class="button button-secondary button-merge" th:if="${canMerge}" th:href="@{/foods/{id}/merge(id=${master.masterId()})}">다른 음식으로 이동</a>
<button class="button button-secondary button-merge" th:unless="${canMerge}" type="button" disabled title="이동할 수 있는 다른 음식이 없어">다른 음식으로 이동</button>
<a class="button" th:href="@{/inventory/new(masterId=${master.masterId()})}">구매 항목 추가</a></div>
<div class="form-actions"><a class="cancel-link purchase-back-link" th:href="@{/inventory(storage=${selectedStorage},warning=${warningOnly ? true : null})}">전체 목록으로</a></div>
</div></main><nav th:replace="~{fragments/shell :: nav('inventory')}"></nav></body></html>
